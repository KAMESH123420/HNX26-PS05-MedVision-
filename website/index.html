<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedVision - Here is your medical Helper</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@800;700&display=swap');
body{font-family:'Inter',sans-serif;background:#020A15;}
@keyframes float{0%,100%{transform:translateY(0) scale(1);filter:drop-shadow(0 0 20px #00D9FF) brightness(1)}50%{transform:translateY(-10px) scale(1.02);filter:drop-shadow(0 0 35px #00D9FF) brightness(1.15)}}
.skeleton{animation:float 4s ease-in-out infinite}
</style></head>
<body class="min-h-screen w-screen relative overflow-hidden flex items-center">
<div class="absolute top-6 left-1/2 -translate-x-1/2 w-[92%] h-[54px] rounded-full flex items-center justify-between px-6 z-20" style="background:linear-gradient(180deg,rgba(255,255,255,0.14),rgba(255,255,255,0.04));backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,0.18)">
<div class="text-white font-bold">✦ MedScan AI</div>
<div class="hidden md:flex gap-7 text-white/50 text-[13px]"><span class="text-white">Home</span><span>About</span><span>Pricing</span></div>
<div class="flex gap-2"><button class="px-4 py-1.5 rounded-full bg-white/10 text-white text-xs">Log in</button><button class="px-4 py-1.5 rounded-full bg-blue-600 text-white text-xs">Get Started</button></div>
</div>
<div class="w-1/2 pl-[5%] z-10">
<h1 class="text-white text-[58px] md:text-[78px] font-extrabold leading-[0.88]">Here is your<br>medical<br>Helper</h1>
<p class="text-white/40 text-xs mt-5 max-w-[340px]">Instant AI second-opinion for doctors. Reads X-ray/CT, localizes abnormalities, gives evidence-backed findings.</p>
<div class="flex gap-3 mt-7"><button class="px-7 py-3 rounded-full bg-gradient-to-r from-cyan-400 to-blue-600 text-white text-sm font-bold">↗ Upload X-RAY</button><button class="px-7 py-3 rounded-full bg-white/5 border border-white/10 text-white/70 text-sm">▶ View Demo</button></div>
</div>
<div class="w-1/2 h-screen flex items-end justify-center relative">
<img src="PASTE_YOUR_SKELETON_HERE" class="skeleton h-[85%] object-contain mb-6" alt="skeleton">
<div class="absolute bottom-[6%] left-1/2 -translate-x-1/2 w-[60%] h-[2px] bg-cyan-400 shadow-[0_0_20px_#00D9FF]"></div>
</div>
</body></html>
